 box-shadow:0 1px 1px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12);cursor:pointer;user-select:none}

 const a=D[i],b=D[j],dx=(b.px+SW/2)-(a.px+SW/2),dy=(b.py+SH/2)-(a.py+SH/2),ox=SW+10-Math.abs(dx),oy=SH+10-Math.abs(dy);
 if(ox>0&&oy>0){moved=true;if(ox<oy){const m=ox/2*Math.sign(dx||1);a.px-=m;b.px+=m}else{const m=oy/2*Math.sign(dy||1);a.py-=m;b.py+=m}}}
 if(!moved)break}
const byId={};let hidden=new Set(),mode="pilot";
D.forEach(d=>{byId[d.id]=d;const e=document.createElement("div");e.className="s"+(d.pilot===2?" p2":"");e.dataset.id=d.id;
 e.innerHTML=`<b>${esc(d.title)}</b><small>${esc(d.verifier).slice(0,60)}</small>${d.real?'<span class="re">real</span>':''}<span class="sc">${d.rv.rubric}</span>`;world.appendChild(e);d.el=e;});
function paint(){const M=MODES[mode];D.forEach(d=>{d.el.style.left=d.px+"px";d.el.style.top=d.py+"px";d.el.style.background=M.colors[M.of(d)]||"#e7e5e4";d.el.classList.toggle("dim",hidden.has(M.of(d)))});
 const counts={};D.forEach(d=>{const k=M.of(d);counts[k]=(counts[k]||0)+1});
 $("#legend").innerHTML=M.keys.map(k=>`<span data-k="${k}" class="${hidden.has(k)?"off":""}"><i style="background:${M.colors[k]}"></i>${esc(M.names[k]||k)} (${counts[k]||0})</span>`).join("");
 document.querySelectorAll("#legend span").forEach(s=>s.onclick=()=>{hidden.has(s.dataset.k)?hidden.delete(s.dataset.k):hidden.add(s.dataset.k);paint()});
 $("#stat").textContent=D.length+" ideas";}
$("#by").onchange=e=>{mode=e.target.value;hidden=new Set();paint()};
let T={x:0,y:0,k:1};const apply=()=>world.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`;
function fit(){const r=view.getBoundingClientRect(),k=Math.min(r.width/(W+60),r.height/(H+60));T={k,x:(r.width-W*k)/2,y:(r.height-H*k)/2};apply()}
$("#fit").onclick=fit;
view.addEventListener("wheel",e=>{e.preventDefault();const r=view.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.min(2.5,Math.max(.12,T.k*(e.deltaY<0?1.12:.89)));
 T.x=mx-(mx-T.x)*k/T.k;T.y=my-(my-T.y)*k/T.k;T.k=k;apply()},{passive:false});
let drag=null;
view.addEventListener("pointerdown",e=>{const s=e.target.closest(".s");drag={s:s&&byId[s.dataset.id],x:e.clientX,y:e.clientY,moved:false};if(!s)view.classList.add("pan");view.setPointerCapture(e.pointerId)});
view.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(!drag.moved)return;
 if(drag.s){drag.s.px+=dx/T.k;drag.s.py+=dy/T.k;drag.s.el.style.left=drag.s.px+"px";drag.s.el.style.top=drag.s.py+"px"}else{T.x+=dx;T.y+=dy;apply()}drag.x=e.clientX;drag.y=e.clientY});
view.addEventListener("pointerup",()=>{if(drag&&!drag.moved&&drag.s)show(drag.s.id);if(drag&&!drag.moved&&!drag.s)hide();drag=null;view.classList.remove("pan")});
function show(id){const d=byId[id],r=d.rv;
 D.forEach(x=>{x.el.classList.toggle("sel",x.id===id);x.el.classList.toggle("nb",d.nb.some(n=>n.id===x.id))});
 const cls=v=>v==="blocks"||v==="no"||v==="insufficient"?"f":v==="permits"||v==="yes"||v==="sufficient"?"h":"u";
 $("#pbody").innerHTML=`<h2>${esc(d.title)}</h2>
 <div class="chips"><span class="chip">pilot ${d.pilot}</span><span class="chip">${esc(d.cell)}</span><span class="chip">arm ${d.arm}</span>${d.real?'<span class="chip h">real opportunity</span>':''}
 <span class="chip">rubric ${r.rubric}</span><span class="chip">novelty ${r.novelty}</span><span class="chip">provenance ${r.prov}</span></div>
 <div class="chips"><span class="chip">${esc(d.family.replace(/_/g," "))}</span><span class="chip">${esc(d.tp.replace(/_/g," "))}</span><span class="chip">${esc(d.origin)} &rarr; ${esc(d.use)} (${d.dist})</span></div>
 <div class="chips"><span class="chip ${cls(r.viol.violated)}">norm violated: ${r.viol.violated}${r.viol.parameter!=="none"?" ("+r.viol.parameter.replace(/_/g," ")+")":""}</span>
 <span class="chip ${cls(r.suff.rating)}">purpose: ${r.suff.rating}</span><span class="chip ${cls(r.tc.permits_minimal_flow)}">law: ${r.tc.permits_minimal_flow}</span>
 <span class="chip">aggregation ${r.agg}</span><span class="chip">issuer willing: ${r.adopt.issuer_willing}</span><span class="chip">verifier can check: ${r.adopt.verifier_can_check}</span></div>
 <dl>${d.setting?`<dt>Cell (pilot 2)</dt><dd>${esc(d.setting)}<br>Fact: ${esc(d.fact)}</dd>`:""}
 <dt>Moment</dt><dd>${esc(d.moment)}</dd><dt>Verifier</dt><dd>${esc(d.verifier)}</dd><dt>Issuer</dt><dd>${esc(d.issuer)}</dd>
 <dt>Predicate needed</dt><dd>${esc(d.predicate)}</dd><dt>Disclosed today</dt><dd>${esc(d.disclosed)}</dd><dt>Why ZK</dt><dd>${esc(d.why)}</dd>
 <dt>Critic: verifier's purpose</dt><dd>${esc(r.purpose)}</dd><dt>Critic: norm violation</dt><dd>${esc(r.viol.reason||"")}</dd>
 <dt>Critic: what the minimal proof loses</dt><dd>${esc(r.suff.lost||"")}</dd><dt>Critic: transmission principle (${esc((r.tc.principle_today||"").replace(/_/g," "))})</dt><dd>${esc(r.tc.reason||"")}</dd>
 ${d.borrowed.length?`<dt>Borrowed from seeds</dt><dd>${d.borrowed.map(b=>`<code>${esc(b.seed_id)}</code>: ${esc(b.borrowed_aspect)}`).join("<br>")}</dd>`:""}
 <dt>Nearest stickers</dt><dd>${d.nb.map(n=>`<a class="nbl" data-id="${n.id}">${esc(byId[n.id].title)} <span class="u">(p${byId[n.id].pilot}, ${n.sim})</span></a>`).join("")}</dd></dl>`;
 document.querySelectorAll(".nbl").forEach(a=>a.onclick=()=>show(a.dataset.id));$("#panel").classList.add("open")}
function hide(){$("#panel").classList.remove("open");D.forEach(x=>x.el.classList.remove("sel","nb"))}
$("#close").onclick=hide;addEventListener("keydown",e=>{if(e.key==="Escape")hide()});
paint();fit();addEventListener("resize",fit);
</script></body></html>
