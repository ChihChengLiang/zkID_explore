- id: rd-eudi-wallet-selective-disclosure-recital
  problem: EU law requires the Digital Identity Wallet to let users disclose only some attributes, so
    relying parties can get what the service needs and no more.
  abstract_problem: A verifier needs one attribute from a larger identity record, but the holder cannot
    share just that attribute from the record.
  mechanism: Selective disclosure of attributes from electronic attestations held in the EU Digital Identity
    Wallet.
  mechanism_outcome: partial
  domain: zkid
  distance_class: adjacent
