- id: rd-swiss-eid-necessary-data-only
  problem: The Swiss e-ID is described as sharing only the data a transaction needs; the technical overview
    says selective disclosure and batch issuance enable this.
  abstract_problem: A business needs one attribute to proceed, but the credential is issued as a whole,
    so the holder must rely on the wallet to release only the needed attribute.
  mechanism: SD-JWT VC selective disclosure with OpenID4VP presentation and status-list validity check.
