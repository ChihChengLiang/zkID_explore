- id: rd-apple-wallet-age-request-categories
  problem: Apple's Verify with Wallet API lists the data an app can request for age checks, and the age
    category also includes the issuing authority and the ID photo.
  abstract_problem: A verifier wants a single over-threshold fact, but the request category bundles the
    issuing authority and a face photo with it, so the verifier can receive more than the age claim.
  mechanism: Age Over N Flag as a separate requestable value under an entitlement-gated API; no shared
    name or address.
  mechanism_outcome: partial
  domain: mdl
  distance_class: adjacent
