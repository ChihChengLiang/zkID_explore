- id: rd-cnpd-lu-tourist-inspect-not-copy
  problem: Tourist accommodation operators in Luxembourg ask to see guests' identity documents and some
    make copies; the regulator reminds them that inspection is allowed and copying is not.
  abstract_problem: A host must confirm a visitor's identity and eligibility, but the usual practice is
    to keep a copy of the whole identity document; the regulator says looking at it is enough.
  mechanism: Visual inspection of the identity document with no copy taken; the statutory duty is met
    by checking, not retaining.
  mechanism_outcome: works
  domain: data-protection-law
