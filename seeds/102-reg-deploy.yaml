- id: rd-google-wallet-zkp-age-no-linkage
  problem: Apps asking for age or identity through Google Wallet's digital ID receive shared data; the
    vendor says it uses zero-knowledge proofs so a verifier learns only the claim.
  abstract_problem: A gatekeeper needs one yes/no fact about a holder, and the proof it receives must
    not reveal the underlying birth date or let the issuer or the gatekeeper track the holder.
  mechanism: Zero-knowledge proof on ISO 18013-7 mdocs for an over-18 statement, device-bound transactions,
    no server-side storage of credential data.
  mechanism_outcome: works
  domain: mdl
  distance_class: adjacent
  source:
