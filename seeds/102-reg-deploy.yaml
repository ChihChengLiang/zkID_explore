- id: rd-twdiw-field-selection-consent
  problem: Taiwan's Digital Identity Wallet lets users pick which fields to disclose in each scenario,
    but the official page does not say which fields an age check releases.
  abstract_problem: A user must prove one eligibility fact to a counter, while the credential holds a
    whole identity record and the user chooses fields at presentation time with no field-level guarantee.
  mechanism: Per-scenario field selection after scanning a QR code, confirmed by biometric check, in the
    TW DIW sandbox.
  mechanism_outcome: partial
