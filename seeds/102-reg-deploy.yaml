- id: rd-singpass-myinfo-minimal-request
  problem: Singpass MyInfo partners retrieve citizen data on consent, and the developer rules tell partners
    not to over-collect beyond what a single purpose needs.
  abstract_problem: A service provider needs a few verified fields for one purpose, but the retrieval
    interface returns a broad profile and the only limit is a policy rule on the partner.
  mechanism: Consent-gated retrieval of named MyInfo fields, with a rule to request only needed data and
    purge unsubmitted drafts.
  mechanism_outcome: partial
