- id: rd-korea-mdl-age-check-barcode
  problem: Korea's digital driver's licence in the PASS app is used for age checks in convenience stores,
    but the same credential also shows the holder's photo on screen.
  abstract_problem: A shop must confirm that a buyer is above an age threshold, but the buyer's credential
    shows the full photo and card details to the cashier, not just the age result.
  mechanism: QR or barcode scan from the wallet app for age verification at the counter; the age result,
    not the full card, is the intended output.
  mechanism_outcome: partial
