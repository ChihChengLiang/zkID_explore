- id: rd-aepd-hotel-no-id-copy
  problem: Hotels must register guests' identity data under the hospitality registration decree; the regulator
    says that duty does not authorise photocopying the whole ID document.
  abstract_problem: A registrant must prove a small set of facts to a host, but the host asks for a full
    copy of the identity document, which carries many extra fields the rule never needed.
  mechanism: Inspect the identity document in person and record only the fields the registration rule
    requires; no copy retained.
  mechanism_outcome: partial
  domain: data-protection-law
  distance_class: adjacent
  source:
