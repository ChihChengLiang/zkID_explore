    date: '2026-10-18'
  status: verified
- id: gdpr-data-minimisation
  problem: Controllers collect whole documents when a narrower field would serve the purpose.
  abstract_problem: A rule obliges anyone requesting information to take only what the purpose needs,
    but gives no practical way to request less than a whole document.
  mechanism: Legal principle of data minimisation; no technical mechanism specified.
  mechanism_outcome: partial
  domain: data-protection-law
  distance_class: adjacent
  source:
    type: regulation
    title: GDPR Article 5(1)(c)
    url: https://gdpr-info.eu/art-5-gdpr/
    locator: Art. 5(1)(c)
    jurisdiction: EU
    lang: en
    retrieved_on: '2026-10-18'
  evidence:
    quote: limited to what is necessary in relation to the purposes for which they are processed
    quote_verified: true
  axes:
