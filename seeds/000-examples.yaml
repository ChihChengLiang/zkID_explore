- id: privacy-pass-unlinkable-proof
  problem: Servers authorise clients with cookies, which let them track the same client across sessions.
  abstract_problem: A gatekeeper only needs to know that the visitor already passed some check, but the
    proof it accepts doubles as a persistent identifier.
  mechanism: Blind-signed tokens that attest prior authorisation and cannot be linked to the issuance
    interaction.
  mechanism_outcome: works
  domain: web-anti-abuse
  distance_class: distant-analog
  source:
    type: distant-analog
    title: RFC 9576 The Privacy Pass Architectural Framework
    url: https://www.rfc-editor.org/rfc/rfc9576.html
    locator: Section 1
    jurisdiction: global
    lang: en
    retrieved_on: '2026-10-18'
  evidence:
    quote: Clients present unlinkable proofs that attest to this information.
    quote_verified: true
  axes:
