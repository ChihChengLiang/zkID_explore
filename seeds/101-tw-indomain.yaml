- id: tw-pdpa-art11-3-deletion-exception
  problem: 個資法第11條第3項：特定目的消失或期限屆滿時應刪除，但因執行職務或業務所必須或經書面同意者不在此限。
  abstract_problem: A party that has collected a person's data must delete it once the reason for holding
    it ends, but an open-ended exception lets it keep the data whenever it says it still needs it for
    its own duties.
  mechanism: Statutory deletion-on-purpose-lapse duty with exceptions for lawful duties or written consent;
    no technical erasure mechanism specified.
  mechanism_outcome: partial
  domain: retention-duties
  distance_class: in-domain
  source:
