- id: tw-pdpa-art5-purpose-limit
  problem: 個資法第5條要求蒐集、處理或利用個人資料不得逾越特定目的之必要範圍，並應與蒐集目的具正當合理之關聯。
  abstract_problem: A rule requires anyone collecting personal data to stay within the necessary scope
    of its stated purpose, but it gives no concrete way to show what was necessary, so the collector decides
    what counts as necessary.
  mechanism: Legal purpose-limitation and proportionality principle; no technical mechanism specified.
  mechanism_outcome: partial
  domain: data-protection-law
  distance_class: in-domain
  source:
