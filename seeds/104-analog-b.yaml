- id: an-b-va-id-scanning
  problem: A merchant may scan the machine-readable zone of a driver's license for an age check, but the
    scan data it may collect and keep is limited to name, address, date of birth and license number, and
    may not be disseminated for marketing.
  abstract_problem: A venue must confirm that a person is over a threshold age from an identity document,
    but scanning captures the whole card, so the rule caps what is kept to a few fields and bans secondary
    use, while the holder still sees everything on the card at the moment of the scan.
  mechanism: Statutory field-limit and retention ban on scan data, with a prohibition on sale or marketing
    dissemination; no proof-of-age mechanism that avoids reading the document.
  mechanism_outcome: partial
