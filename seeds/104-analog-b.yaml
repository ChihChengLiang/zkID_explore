- id: an-b-witness-protection
  problem: The Attorney General may disclose or refuse to disclose the identity or location of a relocated
    or protected witness, weighing danger to the person against the public benefit.
  abstract_problem: A protected person must be able to show a new identity without revealing the old one,
    but the program holder keeps a discretionary exception that lets it disclose the true identity to
    law enforcement or by court order.
  mechanism: Discretionary non-disclosure of identity and location, with a mandatory disclosure exception
    to State or local law enforcement on request or by court order when the person is under investigation
    or charged with a serious offense.
