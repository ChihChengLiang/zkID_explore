- id: an-b-secret-ballot-moad
  problem: In the Australian secret ballot, voters keep their identity anonymous from the vote they cast,
    with separate voting compartments and sealed double envelopes for postal votes.
  abstract_problem: A voter must prove eligibility and cast a valid choice while the record of that choice
    cannot be linked back to them, but the same process must still let officials verify who voted, so
    the separation depends on procedure rather than on a proof.
  mechanism: Separate voting compartments and two-envelope sealing for postal and absentee ballots so
    identity is not attached to the vote at counting; eligibility is checked separately from the ballot.
  mechanism_outcome: works
  domain: secret-ballot
  distance_class: distant-analog
