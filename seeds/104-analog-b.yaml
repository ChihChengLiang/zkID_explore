- id: an-b-sealed-bid-far
  problem: Federal sealed bids must stay unopened and unviewed in a locked or restricted-access box until
    the scheduled opening, and envelopes may be opened only to identify them by an official designated
    for that purpose.
  abstract_problem: A party submits a value that must stay hidden from competitors until a fixed moment,
    while the holder of the submissions must be able to prove later that none were seen early and must
    handle identifying wrappers without exposing the content.
  mechanism: Physical and access-control safeguarding of sealed bids with designated-official exception
    for envelope identification, plus a written record of any mistaken early opening.
