- id: an-b-hipaa-safe-harbor
  problem: Health information may be shared for research or trials as de-identified data only after a
    fixed list of identifiers of the individual and of relatives, employers or household members is removed.
  abstract_problem: A party wants to share a record set that cannot identify any person, but the test
    is a checklist of removable fields plus a no-actual-knowledge condition, so the holder must still
    judge whether leftover fields re-identify someone.
  mechanism: Safe Harbor method removing 18 enumerated identifiers (with ZIP-code truncation rule and
    age aggregation), or an expert-determination alternative; re-identification codes allowed only if
    not derived from or disclosed about the individual.
  mechanism_outcome: works
  domain: clinical-trials
