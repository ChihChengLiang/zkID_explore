- id: an-b-census-title13
  problem: Census data may be used only for statistical purposes, and no publication may allow data furnished
    by a particular individual or establishment to be identified.
  abstract_problem: An agency holding individual responses must release aggregate results, and the legal
    duty bars any output from which a particular respondent can be singled out, while the holder's staff
    can still see the raw records.
  mechanism: Statutory use limitation and publication prohibition enforced by sworn-oath duties and penalties;
    statistical disclosure limitation (for example differential privacy in later census products) is a
    technical layer not specified in the statute.
  mechanism_outcome: partial
