- id: an-b-hipaa-min-necessary
  problem: Covered entities and business associates must limit protected health information to what a
    given use, disclosure or request actually needs.
  abstract_problem: A holder of sensitive records must release only the subset that serves a stated purpose,
    but the rule leaves it to the holder to judge what is minimal and gives no mechanism that proves the
    released subset was minimal.
  mechanism: Purpose-based minimum-necessary rule with reasonable-efforts standard, role-based access
    and reasonable reliance on requester representations (45 CFR 164.514(d)); no cryptographic or proof-based
    check.
  mechanism_outcome: partial
  domain: records
  distance_class: distant-analog
