- id: an-b-attorney-client
  problem: Attorney-client privilege protects confidential communications between a lawyer and client
    about seeking legal advice, but the confidentiality is compromised if a third party is present.
  abstract_problem: A party must consult an advisor about a sensitive matter without the advisor, or anyone
    else, learning or revealing more than the matter requires, but the protection breaks as soon as an
    outsider is in the room unless the outsider is essential to the relationship.
  mechanism: Evidentiary privilege over communications, lost by third-party presence except essential
    agents such as interpreters; no technical mechanism.
  mechanism_outcome: partial
