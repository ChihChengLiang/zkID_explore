- id: an-a-oauth-scopes
  problem: A client asks for broad access scopes to a resource server when it needs only one narrow permission,
    and the user approves the broader grant.
  abstract_problem: A holder asks a verifier for a credential covering more attributes than the single
    fact the relying party needs, and the issuer has no obligation to honour a narrower request.
  mechanism: The client states a scope parameter in the request, and the authorization server returns
    the granted scope in the token response; the server may grant less than requested.
  mechanism_outcome: partial
  domain: oauth-scopes
  distance_class: distant-analog
  source:
