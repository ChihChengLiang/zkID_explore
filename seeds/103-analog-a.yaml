- id: an-a-privacy-pass
  problem: Servers authorise clients with cookies that record a prior challenge, and the same cookie lets
    them track one client across sessions.
  abstract_problem: A verifier only needs to learn that the holder passed an earlier check, but the proof
    it receives can be matched to the issuance event and to every other use of the same proof.
  mechanism: Clients present unlinkable proofs that attest to a prior authorisation, so the origin cannot
    link redemption to issuance or to other redemptions.
  mechanism_outcome: works
  domain: web-anti-abuse
  distance_class: distant-analog
