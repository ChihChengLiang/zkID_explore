- id: an-a-nist-dp
  problem: Publishing statistics about a dataset can reveal whether a particular person's record is in
    it, and the publisher has no quantified measure of how much that leaks.
  abstract_problem: A releaser must answer queries about a dataset so that an observer learns almost nothing
    about whether any one individual contributed, and the leak must be expressed as a bound that can be
    checked.
  mechanism: Differential privacy, a randomised release mechanism with a quantified privacy-loss parameter;
    NIST notes that the guarantee depends on how the framework is realised in practice and lists privacy
    hazards that can break it.
  mechanism_outcome: partial
  domain: data-protection-law
  distance_class: distant-analog
