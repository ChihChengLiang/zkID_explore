- id: an-a-chaum-blind
  problem: A ballot authority must sign a voter's ballot to certify it, but it must not learn how the
    voter voted, and the counted ballot must still be accepted as valid.
  abstract_problem: A signer must certify that a holder has a valid token without seeing the token's content,
    and must later be unable to link the certified token back to the signing event.
  mechanism: A blind signature, where the message is blinded with a random factor before signing, and
    the holder unblinds the signature so it verifies against the original message under the signer's public
    key.
  mechanism_outcome: works
  domain: secret-ballot
  distance_class: distant-analog
  source:
    type: distant-analog
    title: Blind signature (Wikipedia)
    url: https://en.wikipedia.org/wiki/Blind_signature
    locator: Introduction; Blind signature schemes
    jurisdiction: global
    lang: en
    retrieved_on: '2026-10-18'
  evidence:
    quote: An unlinkable blind signature provides this guarantee, as the authority will not see the contents
      of any ballot it signs, and will be unable to link the blinded ballots it signs back to the un-blinded
      ballots it receives for counting.
    quote_verified: true
