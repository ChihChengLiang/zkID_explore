- id: an-a-samesite-cookies
  problem: A cookie is attached to requests made from third-party sites embedded in a page, which lets
    those third parties recognise the same browser across unrelated websites.
  abstract_problem: A stored credential should be presented only to the party that issued it in the current
    context, but the browser sends it on any request the context triggers, so an unrelated observer can
    match the holder across contexts.
  mechanism: The SameSite cookie attribute, which limits the cookie to same-site requests (Strict, Lax,
    or None); the IETF draft describes it as a per-cookie setting, and cross-site behaviour depends on
    the chosen value.
  mechanism_outcome: partial
  domain: ad-tech
  distance_class: distant-analog
