- id: an-a-tor-onion
  problem: A user's network path reveals both who they are and which destination they contact, because
    the first hop that sees their address also sees their traffic in full.
  abstract_problem: A route must be relayed through intermediaries so that no single intermediary holds
    both the origin identity and the final destination, while the traffic still reaches the endpoint.
  mechanism: Onion routing, where the message is wrapped in one encryption layer per relay, and each relay
    peels only its own layer and passes the rest to the next hop.
  mechanism_outcome: partial
  domain: web-anti-abuse
  distance_class: distant-analog
  source:
    type: distant-analog
    title: Onion routing (Wikipedia)
    url: https://en.wikipedia.org/wiki/Onion_routing
    locator: Data; Exit node vulnerability
    jurisdiction: global
    lang: en
    retrieved_on: '2026-10-18'
  evidence:
