_meta:
  purpose: 'Hypothetical certificate catalogue: certificates as bundles of attributes, for mapping predicates onto claims.'
  provenance_levels:
    verified: checked against a fetched public source on the stated date
    recalled: from my memory of the standard or document; plausible but unchecked
    hypothetical: structure invented to complete the picture; no claim that such a credential exists
  caveats:
  - ISO 18013-5 is paywalled and was not available; the mDL element list is recalled, not verified.
  - The Taiwan wallet (TWDIW) site returned 403 to automated fetches; no TWDIW schema was checked.
  - Taiwan certificate field lists are recalled, so treat them as approximations.
  - '''sens'' marks GDPR Art. 9/10 or Taiwan PDPA Art. 6 special categories (recalled list).'
  added: '2026-10-19'
certificates:
- id: eu_pid
  name_en: EU person identification data (reference model)
  name_zh: ''
  issuer_type: gov_civil
  basis: verified (EU PID rulebook v1.7, fetched 2026-10-19)
  format: mdoc or SD-JWT VC
  claims:
  - id: family_name
    type: string
    sens: ordinary
    stab: immutable
  - id: given_name
    type: string
    sens: ordinary
    stab: immutable
  - id: birth_date
    type: date
    sens: ordinary
    stab: immutable
  - id: birth_place
    type: string
    sens: ordinary
    stab: immutable
  - id: nationality
    type: country list
    sens: ordinary
    stab: slow
  - id: portrait
    type: image
    sens: ordinary
    stab: slow
  - id: resident_address
    type: string
    sens: ordinary
    stab: slow
  - id: resident_city
    type: string
    sens: ordinary
    stab: slow
  - id: resident_country
    type: country
    sens: ordinary
    stab: slow
  - id: personal_administrative_number
    type: string
    sens: ordinary
    stab: immutable
  - id: sex
    type: code
    sens: ordinary
    stab: immutable
  - id: issuing_authority
    type: string
    sens: ordinary
    stab: immutable
  - id: issuance_date
    type: date
    sens: ordinary
    stab: immutable
  - id: expiry_date
    type: date
    sens: ordinary
    stab: immutable
  - id: document_number
    type: string
    sens: ordinary
    stab: immutable
  precomputable:
  - age_over_N (separate age attestation under CIR 2024/2977, not part of PID since v1.1)
  note: The structural model for a national ID in a wallet; Taiwan's ID card is mapped on it below.
