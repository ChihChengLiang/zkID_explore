const D=[{"id": "p1:bank-aggregate__D__0", "title": "Landlord rent-payment track record without sharing the tenant's bank statements", "moment": "A tenant renewing a lease or applying for a new rental in Taipei is asked by the landlord or agent to hand over several months of passbook pages or bank app screenshots to show they pay rent on time.", "verifier": "Private landlord or rental agency (房仲/包租代管業者)", "issuer": "The tenant's bank (signing a payment-regularity statistic over the account's transfers)", "disclosed": "Full passbook or app screenshots showing every transaction, balances, salary source, merchants, other account numbers, and often the ID card copy.", "predicate": "Over the last 12 months, at least 11 monthly outgoing transfers to the same payee were made on or before the 5th of the month (count and on-time ratio computed by the bank).", "model": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "would_need_tool"}, "disagree": ["interaction_mode", "verifier_reader"], "rationale": "Count/ratio over 12 months of transfers needs a bank-signed statistic; tenants hand over screenshots today."}, {"id": "p1:bank-aggregate__B__1", "title": "Micro-business owner proves quarterly card-sales turnover to a landlord or platform without exposing customers", "moment": "A night-market stall or small shop owner applying for a stall lease, a delivery-platform onboarding, or a government small-business subsidy is asked for bank statements of the business account to show monthly sales volume.", "verifier": "Market management office, platform, or subsidy-handling agency", "issuer": "Bank holding the business account, as merchant acquirer or account holder", "disclosed": "Complete business account statements listing every customer transfer, supplier payment, personal withdrawals and balances.", "predicate": "Sum of incoming mobile-payment and card-settlement deposits over the last 3 months is at least a stated threshold, and the number of distinct payers exceeds a stated minimum.", "model": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "would_need_tool"}, "disagree": ["verifier_reader"], "rationale": "Sum and distinct-payer count over deposits is a statistic over many records."}, {"id": "p1:bank-aggregate__B__2", "title": "Insurer or employer wellness program checks monthly gym and pharmacy spending band, not itemized purchases", "moment": "A health-insurance discount programme or a corporate wellness benefit in Taiwan asks participants to upload credit-card statements to prove they spent on fitness, with the same statements revealing pharmacy, clinic and other purchases.", "verifier": "Private insurer or employer benefits administrator", "issuer": "Card-issuing bank, which categorizes transactions by merchant category code", "disclosed": "Itemized card statements across all merchants, showing health, pharmacy, entertainment and location patterns.", "predicate": "Total card spending in merchant categories for gyms and sports venues over 12 months falls in a stated band, computed by the bank over the cardholder's cards, with no other category disclosed.", "model": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "would_need_tool"}, "disagree": ["verifier_reader"], "rationale": "Card statements are not catalogued; spend in a category band is an aggregate over transactions."}, {"id": "p1:employer-fresh__D__2", "title": "Current-employee check for a sealed corporate-purchase or tender-staff conflict declaration", "moment": "A procurement officer at a public body or large firm needs evidence that a bidder's named evaluator or subcontract signer is currently employed by the bidding company, without receiving the employee's personnel record, before a tender opening.", "verifier": "Procurement or tender-opening officer", "issuer": "Employer (company authorised signatory) issuing a status credential.", "disclosed": "Company letter with seal (公司大小章), authorisation letter, copy of the signer's ID card and sometimes labor insurance record, enclosed with the sealed bid.", "predicate": "Employer signed, bound to the tender's opening date, that the holder is a current employee in a role authorised to sign; the signature is fresh as of the submission cut-off and can be revoked if the person leaves before opening.", "model": {"interaction_mode": "remote_assisted", "current_evidence": "paper_copy", "verifier_reader": "would_need_tool"}, "other": {"interaction_mode": "in_person_no_device", "current_evidence": "paper_copy", "verifier_reader": "unknown"}, "disagree": ["interaction_mode", "verifier_reader"], "rationale": "Employer signs a current-employee status as of the cut-off; sealed paper bids carry company seals today."}, {"id": "p1:employer-fresh__D__1", "title": "Staff-only discount and access at a company-partnered gym or clinic", "moment": "An employee walks into a gym, dental clinic or cafeteria operator that has a corporate partnership with their employer and wants the staff rate; the counter must confirm the person is currently employed there, not a former employee with an old badge.", "verifier": "Partner gym, clinic, or vendor front desk", "issuer": "Employer, signing a daily or weekly employment-status token; revoking it at departure.", "disclosed": "Staff ID card or badge photo, sometimes a name, employee number and a phone number written on a sign-up sheet; the vendor then keeps the list and may never be told when someone leaves.", "predicate": "Employer signed within the last 24 hours that the holder is a current employee of this company (presented as a member of the partner group, without name).", "model": {"interaction_mode": "in_person_no_device", "current_evidence": "id_shown_in_person", "verifier_reader": "would_need_tool"}, "other": {"interaction_mode": "in_person_with_device", "current_evidence": "id_shown_in_person", "verifier_reader": "would_need_tool"}, "disagree": ["interaction_mode"], "rationale": "Counter only needs a fresh anonymous current-employee token; staff badge is shown at the desk."}, {"id": "p1:gov-nonmember__C__2", "title": "Proving a vehicle owner has no unpaid traffic fines before a used-car sale transfer", "moment": "A buyer at a second-hand car dealer, or a private seller, needs the seller to show that the seller has no unpaid traffic fines or license-suspension notices attached to them or the plate before ownership transfer is processed at the motor vehicle office or agreed privately.", "verifier": "A used-car dealer or a private buyer, and sometimes an escrow or insurance agent", "issuer": "Directorate General of Highways (Ministry of Transportation and Communications) or the Motor Vehicles Office", "disclosed": "Full ID card, driver licence photo, vehicle licence and registration details, and sometimes screenshots of the government fine-lookup page showing the entire list of violations with dates and places.", "predicate": "The holder is not on the list of persons with outstanding unpaid traffic penalties or an active licence suspension (non-membership), tied to the holder, not to a photo of a document.", "model": {"interaction_mode": "in_person_with_device", "current_evidence": "photo_of_id", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "disagree": ["interaction_mode", "current_evidence"], "rationale": "No catalogued certificate carries traffic-fine status; buyer wants absence from the outstanding-fines list."}, {"id": "p1:gov-nonmember__A__0", "title": "Pet boarding and grooming intake without exposing owner's animal-abuse record", "moment": "Booking a multi-day stay at a pet hotel or applying to adopt from a private shelter; the operator wants assurance the person is not on the registered list of those penalized under the Animal Protection Act (e.g., banned from keeping animals).", "verifier": "Pet hotel, private rescue group, or adoption platform", "issuer": "Ministry of Agriculture / local animal protection office (Animal Protection Act enforcement)", "disclosed": "Full ID card photo, name, address, phone, sometimes a hand-written declaration; shelters may also ask for household and employment details.", "predicate": "Holder is not on the competent authority's register of persons prohibited from keeping or adopting animals (non-membership in a sanction list).", "model": {"interaction_mode": "in_person_no_device", "current_evidence": "id_shown_in_person", "verifier_reader": "would_need_tool"}, "other": {"interaction_mode": "remote_online", "current_evidence": "photo_of_id", "verifier_reader": "unknown"}, "disagree": ["interaction_mode", "current_evidence", "verifier_reader"], "rationale": "Absence from a sanction register that is not catalogued; shelters just look at the ID card."}, {"id": "p1:hospital-timed__C__1", "title": "Postpartum or post-surgery 'not fit to travel / fit to return' window for employer leave and insurer claims", "moment": "An employee on 病假 or 產假 extension submits a doctor's certificate to HR, or a patient submits it to a travel insurer, to show they were medically unable to work or travel on specific dates.", "verifier": "Employer HR department or travel/health insurer claims desk", "issuer": "Treating hospital", "disclosed": "診斷證明書 with diagnosis name, ICD code, procedures, and attending physician notes, sent to HR or insurer by scan or email.", "predicate": "Hospital attests 'medically unfit for work/travel for the period [start, end]' as a boolean over a date range, with no diagnosis.", "model": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "would_need_tool"}, "disagree": ["verifier_reader"], "rationale": "Hospital can sign unfit_for_work_between_dates so HR and insurers never see the diagnosis."}, {"id": "p1:hospital-timed__B__0", "title": "Sick-leave validity window for a school or exam make-up without the diagnosis", "moment": "A parent in Taiwan asks a school to excuse a child's absence from a midterm or a school trip, or a university student asks for a make-up exam after illness. The school asks for the diagnosis certificate (診斷證明書) to be photocopied or photographed and sent over LINE or the school portal.", "verifier": "School administrative office or university registrar", "issuer": "Treating hospital, via its physician-signed certificate system", "disclosed": "Full diagnosis certificate showing the diagnosis, the ICD wording, the physician, the department, the full name and the national ID number. It is often kept in the student file or sent through a class group chat.", "predicate": "A hospital physician attests that the holder was medically unfit to attend school or sit exams between date A and date B. The proof is valid only for that window and reveals no diagnosis, department or treatment.", "model": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "disagree": [], "rationale": "Schools receive diagnosis photos over LINE; a signed unfit-between-dates claim would suffice."}, {"id": "p1:platform-thresh__D__1", "title": "Ride-hailing driver trip count to qualify for a fleet vehicle lease discount", "moment": "A part-time Uber or LINE Taxi driver in Kaohsiung applies at a car leasing company for a discounted lease reserved for drivers with a proven active record.", "verifier": "Car leasing or fleet financing company", "issuer": "Ride-hailing platform account (driver portal), proven by zkTLS over the logged-in driver portal session", "disclosed": "Monthly earnings statements and the full trip history export, including pickup and drop-off addresses of passengers, the driver's bank account and tax details", "predicate": "Platform account shows at least 1,000 completed trips and at least 12 active months", "model": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "disagree": ["interaction_mode"], "rationale": "Platform never issues credentials so a zkTLS-derived threshold on trip count is needed."}, {"id": "p1:platform-thresh__A__0", "title": "Delivery-platform courier rating for a building management committee hire", "moment": "A residential community (社區) in Taipei hires a part-time package-room or night-shift concierge, or lets a gig courier get a building access tag. The management committee wants evidence of reliability.", "verifier": "Community management committee (管理委員會) or its property management company", "issuer": "Delivery platform account (Uber Eats / foodpanda courier app), attested via zkTLS over the logged-in session; the platform never agreed to issue credentials", "disclosed": "Screenshots of the courier app profile showing real name, photo, phone number, order history, earnings, and city zones worked", "predicate": "Lifetime completed deliveries on a delivery platform is at least 500 AND average customer rating is at least 4.7", "model": {"interaction_mode": "in_person_with_device", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "disagree": ["interaction_mode"], "rationale": "Two thresholds over unsigned platform data proven via zkTLS; screenshots are shown today."}, {"id": "p1:telco-unique__A__2", "title": "One free-trial or student-discount sign-up per person on an online learning or streaming service", "moment": "A Taiwanese online course platform or video streaming service offers a one-time free trial or first-month discount, and abusers re-register with new emails and bought SMS numbers to get repeated trials.", "verifier": "A subscription streaming or e-learning platform operating in Taiwan.", "issuer": "A Taiwanese mobile carrier.", "disclosed": "Mobile phone number, email, sometimes a credit card number for the trial, and device fingerprints, which together identify the person for later marketing and cross-service tracking.", "predicate": "The signer is one unique real telco subscriber, with a trial-specific nullifier not seen before.", "model": {"interaction_mode": "remote_online", "current_evidence": "app_login", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_online", "current_evidence": "app_login", "verifier_reader": "unknown"}, "disagree": [], "rationale": "One trial per real subscriber needs a per-service nullifier; platform loses revenue to abusers."}, {"id": "p1:telco-unique__A__1", "title": "One vote per person in an apartment-building or community management committee online poll", "moment": "A Taiwanese residential community (a building management committee) runs an online poll for a repair fund or rule change, and needs one ballot per resident household member without exposing who voted how.", "verifier": "The community management committee (or its property management company) running a LINE or web voting tool.", "issuer": "A Taiwanese mobile carrier.", "disclosed": "Name, unit number, phone number, and often a LINE ID, all tied to the ballot or at least visible to the administrator.", "predicate": "The voter is one unique real subscriber, and the ballot nullifier is unique for this poll.", "model": {"interaction_mode": "remote_online", "current_evidence": "app_login", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "would_need_tool"}, "disagree": ["current_evidence", "verifier_reader"], "rationale": "One ballot per subscriber per poll with ballot secrecy needs a nullifier."}, {"id": "p1:univ-crossmatch__B__2", "title": "Hospital internship or clinical-placement badge matched to professional licence", "moment": "A nursing or medical student starts a clinical placement at a teaching hospital, and the hospital must confirm the university-enrolled student is the same person as the holder of a separate vaccination or background-check record from another issuer.", "verifier": "Hospital HR or placement coordinator", "issuer": "University (placement eligibility), matched against a second issuer such as the health authority vaccination record", "disclosed": "Full vaccination card, national ID copy, student ID, sometimes a full health check report, collected into a paper file.", "predicate": "The university-signed placement-eligibility claim and the health-authority vaccination claim refer to the same person, with neither the ID number nor other health records revealed.", "model": {"interaction_mode": "in_person_no_device", "current_evidence": "paper_copy", "verifier_reader": "would_need_tool"}, "other": {"interaction_mode": "in_person_no_device", "current_evidence": "paper_copy", "verifier_reader": "unknown"}, "disagree": ["verifier_reader"], "rationale": "Two issuers' claims must bind to the same person; paper file of IDs and cards today."}, {"id": "p1:univ-crossmatch__C__1", "title": "Dormitory and campus-housing off-campus lease renewal tied to a landlord-side identity record", "moment": "A student renting a room near campus is asked by the landlord or a rental agency to prove both that they are enrolled and that the person named on the lease is the same one the university enrolled, so the landlord can claim rent subsidy or insurance cover.", "verifier": "Private landlord or rental agency, and possibly a subsidy administrator reviewing the lease.", "issuer": "University registrar, matched against a household registration or ID credential from a government issuer.", "disclosed": "Photocopy of national ID card front and back, student ID, and sometimes household register transcript, kept by the agent with no stated retention limit.", "predicate": "The university's signed enrolment claim and the lease or household-record claim from a second issuer (such as the household registration office) refer to the same person, without disclosing the ID number to the landlord.", "model": {"interaction_mode": "in_person_no_device", "current_evidence": "paper_copy", "verifier_reader": "would_need_tool"}, "other": {"interaction_mode": "remote_assisted", "current_evidence": "photo_of_id", "verifier_reader": "unknown"}, "disagree": ["interaction_mode", "current_evidence", "verifier_reader"], "rationale": "Agents photocopy ID cards to link enrolment and household records; join proof avoids the ID number."}, {"id": "p1:utility-member__B__0", "title": "Low-income electricity subsidy proof for school lunch or tuition aid", "moment": "A parent applies for a school's low-income or near-poor student aid (tuition waiver, free lunch, after-school care subsidy) and is asked to submit a household certificate plus a copy of recent utility bills to show the household sits on the subsidised-electricity roll.", "verifier": "School administrative office or district education bureau", "issuer": "Taiwan Power Company (Taipower), signing membership of its welfare-tariff roll", "disclosed": "Full utility bill with address, account number, meter number, monthly usage and payment history, often photocopied and kept in the student file.", "predicate": "The household's electricity account is a member of the utility's low-income or welfare-tariff roll (set membership), with no address or kWh usage revealed.", "model": {"interaction_mode": "in_person_no_device", "current_evidence": "paper_copy", "verifier_reader": "would_need_tool"}, "other": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "disagree": ["interaction_mode", "current_evidence", "verifier_reader"], "rationale": "Taipower can sign on_subsidy_roll; schools photocopy bills with address and usage."}, {"id": "p1:utility-member__C__0", "title": "Taipower subsidy-roll proof for a low-income solar rooftop co-op deposit waiver", "moment": "A household applies to join a community rooftop-solar or energy-saving appliance trade-in scheme run by a township office or NGO, which offers a reduced deposit or free installation to households on a subsidised electricity roll. The counter asks for a recent Taipower bill photocopy to confirm the discount.", "verifier": "Township office or NGO running the energy-efficiency program", "issuer": "Taipower (or the Taipower subsidy roll maintainer, co-signing with the social affairs bureau list)", "disclosed": "Full electricity bill copy showing the service address, account number, monthly kWh usage, billing amounts, and the household name", "predicate": "This account is a member of the Taipower low-income or vulnerable-household discount roll (set membership, current period)", "model": {"interaction_mode": "in_person_no_device", "current_evidence": "paper_copy", "verifier_reader": "would_need_tool"}, "other": {"interaction_mode": "remote_assisted", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "disagree": ["interaction_mode", "current_evidence", "verifier_reader"], "rationale": "Same subsidy-roll membership claim; counter photocopies a bill today."}, {"id": "p2:union-ballot__C__1", "title": "Shared bargaining ballot across an industrial union branch and the enterprise union", "moment": "A factory-branch union of a multi-site manufacturer holds a ballot on whether to accept a collective-agreement offer. Members at contractor and subsidiary sites vote too, so the organizing union must confirm they are dues-paying members of an affiliated union, and today that means sending their union ID photos and payroll dues slips, which expose both membership and employer to the host union.", "verifier": "The confederation or industrial union's ballot organizer collecting votes from affiliated enterprise unions' members", "issuer": "Each affiliated union signs a membership credential; the confederation accepts any of the registered unions' issuer keys as a set", "disclosed": "Union membership card photo, national ID number, employer name and payroll dues slip from the member's own union", "predicate": "I am a dues-paying member in good standing of one of the affiliated unions, without disclosing which one or my employer, and I vote once", "model": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "would_need_tool"}, "disagree": ["verifier_reader"], "rationale": "Set membership across several issuers plus one vote each; hides which union and employer."}, {"id": "p2:vending-age__C__2", "title": "Hotel-lobby minibar and craft-liquor vending machine for foreign visitors and residents", "moment": "A resident foreigner with an ARC, and a Taiwanese guest, each try to buy a bottle from a lobby vending machine at a tourist hotel in Hualien. Today the hotel front desk photocopies the passport or ARC to unlock the machine for the room, and the copies sit in a folder.", "verifier": "Hotel operator running an alcohol vending machine unlocked via the front-desk system", "issuer": "National Immigration Agency for ARC holders, Ministry of the Interior for citizens", "disclosed": "Photocopy of passport or ARC (name, nationality, document number, birth date, photo) retained by the hotel", "predicate": "Holder is over the legal drinking age, proven from either a Taiwan ID or ARC credential, without disclosing nationality, passport number or ARC number", "model": {"interaction_mode": "in_person_no_device", "current_evidence": "paper_copy", "verifier_reader": "would_need_tool"}, "other": {"interaction_mode": "in_person_no_device", "current_evidence": "photo_of_id", "verifier_reader": "unknown"}, "disagree": ["current_evidence", "verifier_reader"], "rationale": "Both ARC and national ID can carry age_over_NN; hotel photocopies passports today."}, {"id": "p2:dv-lease-break__C__2", "title": "Presenting a protection-order claim to a rental platform or social housing office once, not per listing", "moment": "A survivor searching for a new rental applies to many listings through a rental platform and a city social-housing or rent-subsidy office, each of which wants the order shown to qualify her for priority placement, deposit waiver or subsidy. Every landlord she applies to receives a fresh copy, and the same document lets them recognise her across unrelated applications.", "verifier": "City housing bureau or rent-subsidy office, and rental platforms offering a priority or reduced-deposit channel", "issuer": "The municipal 家庭暴力暨性侵害防治中心 or a contracted women's shelter (such as a 婦女救援基金會 branch) signing the attestation.", "disclosed": "A copy of the order or a social worker letter with her name, ID number, and case details, given repeatedly to multiple parties who can compare and match the copies.", "predicate": "Holder is currently covered by an active protection order for the next lease-start window, shown as a presentation bound to the specific verifier and application.", "model": {"interaction_mode": "remote_online", "current_evidence": "paper_copy", "verifier_reader": "unknown"}, "other": {"interaction_mode": "remote_online", "current_evidence": "digital_upload", "verifier_reader": "would_need_tool"}, "disagree": ["current_evide  return["id,interaction_mode,current_evidence,verifier_reader,changed,checked,note"].concat(D.map(d=>{const c=cur(d),e=st[d.id]||{};const ch=Object.keys(OPT).filter(f=>c[f]!==d.model[f]).join("|");return[d.id,c.interaction_mode,c.current_evidence,c.verifier_reader,ch,e.done?"yes":"no",q(e.note)].join(",")})).join("\n")+"\n"}
